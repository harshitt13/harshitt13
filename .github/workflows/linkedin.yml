name: Update LinkedIn Post

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "LinkedIn profile slug"
        required: false
        default: "harshitt13"
        type: string
      post_url:
        description: "Optional: public LinkedIn post URL (provide with post_text)"
        required: false
        type: string
      post_text:
        description: "Optional: post excerpt (provide with post_url)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: linkedin-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Test updater
        run: node --test scripts/linkedin.test.js
      - name: Install browser for public post lookup
        if: ${{ inputs.post_url == '' }}
        run: npx playwright install --with-deps chromium
      - name: Update both README files
        env:
          LINKEDIN_USERNAME: ${{ inputs.username || 'harshitt13' }}
          LINKEDIN_POST_URL: ${{ inputs.post_url }}
          LINKEDIN_POST_TEXT: ${{ inputs.post_text }}
        run: npm run update:linkedin
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md README1.md; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README1.md
          git commit -m "chore: update LinkedIn post"
          git push
